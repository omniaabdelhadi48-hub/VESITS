<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VESTIS B2B | لوحة تحكم التجار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#1a1a1a;--b2b-dark:#1e293b;--b2b-accent:#c59d5f;--bg:#f1f5f9;--white:#ffffff;--text-muted:#64748b;--success:#10b981;--warning:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;}
body{background-color:var(--bg);color:var(--primary);}
header{background-color:var(--b2b-dark);color:var(--white);padding:1rem 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
.logo{font-size:1.5rem;font-weight:800;color:var(--b2b-accent);}
.merchant-info{display:flex;align-items:center;gap:15px;font-size:0.9rem;}
.status-badge{background:rgba(16,185,129,0.2);color:#34d399;padding:4px 12px;border-radius:20px;font-weight:700;font-size:0.8rem;}
.nav-tabs{background:var(--white);padding:0 5%;display:flex;gap:1rem;border-bottom:1px solid #e2e8f0;overflow-x:auto;}
.tab-btn{padding:1rem 1.2rem;border:none;background:none;font-size:0.95rem;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--b2b-dark);border-bottom-color:var(--b2b-accent);}
.container{max-width:1100px;margin:2rem auto;padding:0 20px;}
.wallet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem;margin-bottom:2rem;}
.stat-card{background:var(--white);padding:1.5rem;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.03);border-right:4px solid var(--b2b-dark);}
.stat-card.frozen{border-right-color:var(--warning);} .stat-card.active-pts{border-right-color:var(--success);} .stat-card.credit{border-right-color:var(--b2b-accent);}
.stat-title{font-size:0.85rem;color:var(--text-muted);margin-bottom:0.5rem;}
.stat-value{font-size:1.6rem;font-weight:800;color:var(--b2b-dark);}
.stat-sub{font-size:0.75rem;color:var(--text-muted);margin-top:0.3rem;}
.section{display:none;} .section.active{display:block;}
.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;}
.code-card{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.04);border:1px solid #e2e8f0;}
.code-header{background:var(--b2b-dark);color:var(--white);padding:0.8rem 1.2rem;display:flex;justify-content:space-between;align-items:center;}
.secret-code{font-weight:800;color:var(--b2b-accent);letter-spacing:1px;}
