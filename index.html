<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;}
body{background:#fdfaff;color:#2d1b36;text-align:center;min-height:100vh;display:flex;flex-direction:column;}
header{background:#2d1b36;color:#fff;padding:1rem 5%;display:flex;justify-content:space-between;align-items:center;}

.card{background:#fff;border:1px solid #f3e8ff;border-radius:14px;padding:2rem;width:300px;box-shadow:0 4px 15px rgba(0,0,0,0.04);}
.card h2{margin-bottom:0.5rem;}
.card p{font-size:0.9rem;margin-bottom:1.5rem;}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;color:#fff;font-size:1rem;}
.btn-girls{background:#9b59b6;}

<footer>VESTIS © 2026 - أسوان</footer>
