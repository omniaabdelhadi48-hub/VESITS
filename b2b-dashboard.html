<script>
if (!sessionStorage.getItem('vestis_merchant')) {
  window.location.replace('b2b-login.html');
}
</script>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة التجار - VESTIS</title>
<style>
  body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 0; }
  .header { background: #111; color: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { margin: 0; font-size: 22px; }
  .header button { background: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .box { background: #fff; margin: 20px; padding: 20px; border-radius: 12px; }
  .box h2 { margin-top: 0; }
  .products { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .product { border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; }
  .product button { background: #111; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <h1>VESTIS - صفحة التجار</h1>
  <button onclick="logout()">تسجيل خروج</button>
</div>

<div class="box">
  <h2>أهلاً بيك يا تاجر 👋</h2>
  <p>دي صفحة التجار الخاصة، مش هتفتح غير بالكود.</p>
</div>

<div class="box">
  <h2>المنتجات</h2>
  <div class="products">
    <div class="product">
      <h3>منتج 1</h3>
      <p>السعر: 200 جنيه</p>
      <button>اطلب</button>
    </div>
    <div class="product">
      <h3>منتج 2</h3>
      <p>السعر: 350 جنيه</p>
      <button>اطلب</button>
    </div>
  </div>
</div>

<script>
function logout() {
  sessionStorage.removeItem('vestis_merchant');
  window.location.replace('b2b-login.html');
}
</script>

</body>
</html>
