<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول التجار - VESTIS</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#0f172a;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.box{background:#fff;width:100%;max-width:400px;padding:26px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.logo{text-align:center;font-weight:800;font-size:24px;color:#1e293b}
.logo span{color:#c59d5f}
.sub{text-align:center;color:#64748b;font-size:13px;margin:8px 0 18px;line-height:1.6}
label{font-weight:700;font-size:13px;display:block;margin-top:10px}
input,select{width:100%;padding:13px;margin-top:6px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;background:#fff}
input:focus,select:focus{outline:none;border-color:#1e293b}
.btn{width:100%;padding:14px;border:none;border-radius:10px;background:#1e293b;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:16px}
.btn:active{transform:scale(.98)}
#err{display:none;background:#fef2f2;color:#dc2626;padding:10px;border-radius:8px;font-size:13px;text-align:center;margin-top:12px}
.links{text-align:center;margin-top:16px;font-size:13px;line-height:2}
.links a{color:#1e293b;font-weight:700;text-decoration:none}
.wa{display:block;background:#25D366;color:#fff!important;padding:12px;border-radius:10px;font-weight:800;margin-top:10px}
.note{text-align:center;font-size:11px;color:#94a3b8;margin-top:14px}
.phone-row{display:flex;gap:8px;direction:ltr}
.phone-row select{width:115px;margin-top:6px}
.phone-row input{flex:1}
</style>
</head>
<body>

<div class="box">
  <div class="logo">VESTIS <span>تجار</span></div>
  <p class="sub">دخول التجار المعتمدين فقط<br>أسعار الجملة سرية ومش بتظهر لغير التجار</p>

  <label>رقم التليفون</label>
  <div class="phone-row">
    <select id="countryCode">
      <option value="+20" selected>🇪🇬 +20</option>
      <option value="+966">🇸🇦 +966</option>
      <option value="+971">🇦🇪 +971</option>
      <option value="+965">🇰🇼 +965</option>
      <option value="+974">🇶🇦 +974</option>
      <option value="+962">🇯🇴 +962</option>
      <option value="+961">🇱🇧 +961</option>
      <option value="+963">🇸🇾 +963</option>
      <option value="+964">🇮🇶 +964</option>
      <option value="+213">🇩🇿 +213</option>
      <option value="+212">🇲🇦 +212</option>
      <option value="+216">🇹🇳 +216</option>
      <option value="+218">🇱🇾 +218</option>
      <option value="+249">🇸🇩 +249</option>
    </select>
    <input id="phone" type="tel" value="1012345678" placeholder="1012345678" inputmode="numeric">
  </div>

  <label>اسم المحل بالظبط</label>
  <input id="shop" type="text" value="محل النور">

  <label>كود التاجر</label>
  <input id="code" type="text" value="VESTIS-1234">

  <button class="btn" onclick="login()">دخول بوابة التجار</button>
  <div id="err">البيانات غلط، اتأكد من رقم التليفون واسم المحل والكود</div>

  <div class="links">
    <a href="b2c-portal.html">← ارجعي لبوابة البنات</a><br>
    <span style="color:#64748b">تاجر جديد ومش معاك كود؟</span><br>
    <!-- غيري الرقم ده برقمك: 2010XXXXXXXX -->
    <a class="wa" href="https://wa.me/201000000000?text=%D8%A3%D9%87%D9%84%D8%A7%D8%8C%20%D8%A3%D9%86%D8%A7%20%D8%B5%D8%A7%D8%AD%D8%A8%20%D9%85%D8%AD%D9%84%20%D9%88%D8%B9%D8%A7%D9%8A%D8%B2%20%D9%83%D9%88%D8%AF%20%D8%AA%D8%A7%D8%AC%D8%B1%20%D9%81%D9%8A%20VESTIS%0A%D8%A7%D8%B3%D9%85%20%D8%A7%D9%84%D9%85%D8%AD%D9%84%3A%0A%D8%B1%D9%82%D9%85%20%D8%A7%D9%84%D8%AA%D9%84%D9%8A%D9%81%D9%88%D9%86%3A%0A%D8%A7%D9%84%D9%85%D9%83%D8%A7%D9%86%3A" target="_blank">اطلب كود تاجر من واتساب</a>
  </div>

  <p class="note">الكود خاص بمحلك بس، متبعتوش لحد</p>
</div>

<script>
const merchants = [
  { phone: "+201012345678", shop: "محل النور", code: "VESTIS-1234" },
  { phone: "+966501234567", shop: "سنتر الرياض", code: "VESTIS-5678" },
];

function login(){
  const countryCode = document.getElementById('countryCode').value;
  const rawPhone = document.getElementById('phone').value.trim().replace(/^0+/, '');
  const phone = countryCode + rawPhone;
  const shop = document.getElementById('shop').value.trim();
  const code = document.getElementById('code').value.trim();
  const err = document.getElementById('err');
  if(!rawPhone || !shop || !code){
    err.textContent = "اكتب التلاتة: رقم التليفون واسم المحل والكود";
    err.style.display = 'block';
    return;
  }
  const found = merchants.find(m => m.phone === phone && m.shop === shop && m.code === code);
  if(found){
    sessionStorage.setItem('vestis_merchant', JSON.stringify(found));
    window.location.href = 'b2b-dashboard.html';
  } else {
    err.textContent = "البيانات غلط، اتأكد من كود الدولة ورقم التليفون واسم المحل والكود";
    err.style.display = 'block';
  }
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter') login();
});
</script>

</body>
</html>
