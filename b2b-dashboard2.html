<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VESTIS | بوابة التجار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#f8fafc;color:#1e293b}
header{background:#1e293b;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px;color:#c59d5f}
.tabs{display:flex;gap:8px;padding:15px 5%;background:#fff}
.tab{padding:10px 16px;border:1px solid #e2e8f0;border-radius:20px;background:#f1f5f9;cursor:pointer;font-weight:700}
.tab.active{background:#1e293b;color:#fff}
main{padding:20px 5%}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #e2e8f0;border-radius:8px}
button{padding:12px 18px;border:none;border-radius:8px;background:#1e293b;color:#fff;font-weight:700;cursor:pointer;width:100%}
.hidden{display:none}
.code-box{background:#fef3c7;padding:15px;border-radius:8px;text-align:center;font-size:20px;font-weight:800;margin-top:10px}
</style>
</head>
<body>
<header><div class="logo">VESTIS - تجار</div><button style="width:auto" onclick="location.href='index.html'">🏠 الرئيسية</button></header>
<div class="tabs">
<button class="tab active" onclick="show('home',this)">الرئيسية</button>
<button class="tab" onclick="show('stock',this)">سوق الرواكد</button>
<button class="tab" onclick="show('send',this)">إرسال بضاعة</button>
<button class="tab" onclick="show('credit',this)">باقات الآجل</button>
</div>
<main>
<div id="home" class="card"><h2>أهلاً بيك يا تاجر 👋</h2><p>من هنا تقدر تبيع رواكدك، تبعت بضاعة، وتطلب باقة آجل.</p><button onclick="show('stock',document.querySelectorAll('.tab')[1])">شوف سوق الرواكد</button></div>
<div id="stock" class="card hidden"><h2>سوق الرواكد</h2><p>• فستان سواريه - 350ج - أسوان</p><p>• عباية - 280ج - دراو</p><p>• بلوزة - 120ج - كوم أمبو</p></div>
<div id="send" class="card hidden"><h2>إرسال بضاعة</h2><input placeholder="اسم المحل"><input placeholder="نوع البضاعة"><input placeholder="الكمية"><button onclick="alert('تم استلام طلبك، هنتواصل معاك')">إرسال الطلب</button></div>
<div id="credit" class="card hidden"><h2>باقات الآجل</h2><select><option>باقة 5000ج</option><option>باقة 10000ج</option><option>باقة 20000ج</option></select><button onclick="document.getElementById('code').style.display='block';document.getElementById('code').innerText='كودك: VESTIS-'+Math.floor(Math.random()*9000+1000)">اطلب كود الباقة</button><div id="code" class="code-box" style="display:none"></div></div>
</main>
<script>
function show(id,btn){
document.querySelectorAll('main > div').forEach(d=>d.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
if(btn) btn.classList.add('active');
}
</script>
</body>
</html>
